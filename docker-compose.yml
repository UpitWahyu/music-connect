# Development stack — Music Connect (PRD §37)
# Usage: docker compose up -d mysql redis   (server runs via PM2 in V1)
#
# SECURITY: MySQL/Redis are bound to 127.0.0.1 only so they are NOT reachable
# from the public Internet (audit P1 #7). Production (this VPS) runs MySQL/Redis
# locally with no published ports; the reverse proxy (Caddy) is the only public
# entry point. Do NOT change these to "3306:3306" / "6379:6379" on a host with a
# public IP unless you intend to expose the database.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: music_connect
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  music-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
